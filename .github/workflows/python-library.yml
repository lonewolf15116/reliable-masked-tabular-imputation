name: Python library tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Check distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test wheel in isolated virtual environment
        shell: bash
        run: |
          python -m venv /tmp/rmti-wheel-smoke
          /tmp/rmti-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/rmti-wheel-smoke/bin/python -c "import reliable_masked_tabular_imputation as r; import pandas as pd; x=pd.DataFrame({'a':[1.,2.,3.,4.]}); m=r.make_mcar_mask(x,0.5,random_state=0); assert int(m.to_numpy().sum())==2; assert int(r.apply_mask(x,m).isna().to_numpy().sum())==2"
