name: Final qolmat sparse-mask reproduction
on:
  push:
    branches: ["feature/qolmat-final-verification"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned qolmat and capture versions
        run: |
          python -m pip install qolmat==0.2.0
          mkdir -p qolmat-final-results
          python -m pip freeze > qolmat-final-results/pip_freeze.txt
      - name: Reproduce and test fixed-mask compatibility
        run: python prospective/competitor_stage1/qolmat_final_verification.py
      - name: Upload all verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qolmat-final-verification
          path: qolmat-final-results/
          if-no-files-found: warn
