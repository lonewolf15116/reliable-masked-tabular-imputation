name: Publish RMTI v0.1.0 to PyPI

# Deliberately manual, and deliberately pinned to the reviewed v0.1.0 tag.
# Do not broaden this trigger to push, pull_request, or release without review.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Rebuild and verify tagged source
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: v0.1.0
          persist-credentials: false
      - name: Assert pinned source commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a79cebbdd4bfac4afa083c24ee01c554e6d29393"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Confirm artifact metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from email.parser import Parser
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(archives) == 1, (wheels, archives)
          with ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              metadata_file = next(p for p in names if p.endswith(".dist-info/METADATA"))
              metadata = Parser().parsestr(wheel.read(metadata_file).decode("utf-8"))
              assert metadata["Name"] == "reliable-masked-tabular-imputation"
              assert metadata["Version"] == "0.1.0"
              assert metadata["License-Expression"] == "MIT"
              assert any(p.endswith("/LICENSE") or "/licenses/LICENSE" in p for p in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rmti-v0.1.0-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish through PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reliable-masked-tabular-imputation/0.1.0/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rmti-v0.1.0-distributions
          path: dist/
      - name: Publish to PyPI (OIDC, no stored API token)
        uses: pypa/gh-action-pypi-publish@release/v1
